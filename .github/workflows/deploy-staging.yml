name: deploy-staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load project variables
        env:
          APP_BIND_PORT: ${{ secrets.APP_BIND_PORT }}
          PUBLIC_PORT: ${{ secrets.PUBLIC_PORT }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
        run: |
          APP_NAME="${APP_NAME:-${GITHUB_REPOSITORY##*/}}"
          APP_BIND_PORT="${APP_BIND_PORT:-8000}"
          PUBLIC_PORT="${PUBLIC_PORT:-80}"
          SERVER_NAME="${SERVER_NAME:-_}"
          IMAGE_TAG="${GITHUB_SHA}"

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "APP_DIR=/opt/${APP_NAME}-staging" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP_NAME}-api" >> "$GITHUB_ENV"
          echo "AGENT_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP_NAME}-agent" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "APP_BIND_PORT=${APP_BIND_PORT}" >> "$GITHUB_ENV"
          echo "PUBLIC_PORT=${PUBLIC_PORT}" >> "$GITHUB_ENV"
          echo "SERVER_NAME=${SERVER_NAME}" >> "$GITHUB_ENV"

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:staging

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.AGENT_IMAGE }}:staging

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_PRIVATE_KEY }}

      - name: Add staging host key
        env:
          VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files to staging VPS
        env:
          VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          VPS_USER: ${{ secrets.STAGING_VPS_USER }}
          VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p \"${APP_DIR}\""
          scp -P "${VPS_PORT:-22}" deploy/staging/docker-compose.staging.yml "$VPS_USER@$VPS_HOST:${APP_DIR}/docker-compose.staging.yml"
          scp -P "${VPS_PORT:-22}" deploy/staging/sip.yaml "$VPS_USER@$VPS_HOST:${APP_DIR}/sip.yaml"
          python - <<'PY'
          from pathlib import Path
          import os

          livekit_api_key = os.environ["LIVEKIT_API_KEY"]
          livekit_api_secret = os.environ["LIVEKIT_API_SECRET"]

          Path(".livekit.yaml").write_text(
              "\n".join(
                  [
                      "port: 7880",
                      "log_level: info",
                      "",
                      "keys:",
                      f"  {livekit_api_key}: {livekit_api_secret}",
                      "",
                      "rtc:",
                      "  node_ip: 0.0.0.0",
                      "  tcp_port: 7881",
                      "  port_range_start: 50000",
                      "  port_range_end: 60000",
                      "  use_external_ip: true",
                      "",
                      "redis:",
                      "  address: redis:6379",
                      "",
                      "turn:",
                      "  enabled: false",
                      "",
                  ]
              )
          )
          PY
          scp -P "${VPS_PORT:-22}" .livekit.yaml "$VPS_USER@$VPS_HOST:${APP_DIR}/livekit.yaml"
          envsubst '${APP_NAME} ${APP_BIND_PORT} ${PUBLIC_PORT} ${SERVER_NAME}' < deploy/prod/nginx/site.conf.template > .site.conf
          scp -P "${VPS_PORT:-22}" .site.conf "$VPS_USER@$VPS_HOST:/tmp/${APP_NAME}-staging.conf"

      - name: Deploy on staging VPS
        env:
          VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          VPS_USER: ${{ secrets.STAGING_VPS_USER }}
          VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          VOBIZ_API_KEY: ${{ secrets.VOBIZ_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INTERNAL_API_SHARED_SECRET: ${{ secrets.INTERNAL_API_SHARED_SECRET }}
        run: |
          printf '%s\n' \
            "API_IMAGE=${API_IMAGE}:${IMAGE_TAG}" \
            "AGENT_IMAGE=${AGENT_IMAGE}:${IMAGE_TAG}" \
            "APP_BIND_PORT=${APP_BIND_PORT}" \
            "PUBLIC_PORT=${PUBLIC_PORT}" \
            "SERVER_NAME=${SERVER_NAME}" \
            "DB_NAME=fettle_staging" \
            "DB_USER=postgres" \
            "DB_PASSWORD=postgres" \
            "DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/fettle_staging" \
            "LIVEKIT_URL=http://livekit-server:7880" \
            "LIVEKIT_API_KEY=${LIVEKIT_API_KEY}" \
            "LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}" \
            "LIVEKIT_ROOM_NAME=default" \
            "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" \
            "OPENROUTER_MODEL=openai/gpt-4o" \
            "OPENAI_API_KEY=${OPENAI_API_KEY}" \
            "SONIOX_API_KEY=${SONIOX_API_KEY}" \
            "VOBIZ_API_URL=https://api.vobiz.ai" \
            "VOBIZ_API_KEY=${VOBIZ_API_KEY}" \
            "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" \
            "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" \
            "AWS_REGION=ap-south-1" \
            "S3_BUCKET_NAME=fettle-media" \
            "JWT_SECRET_KEY=${JWT_SECRET_KEY}" \
            "INTERNAL_API_SHARED_SECRET=${INTERNAL_API_SHARED_SECRET}" \
            "INTERNAL_API_BASE_URL=http://api:8000" \
            "REDIS_URL=redis://redis:6379/0" \
            "CELERY_BROKER_URL=redis://redis:6379/0" \
            "CELERY_RESULT_BACKEND=redis://redis:6379/0" > .vps.env

          scp -P "${VPS_PORT:-22}" .vps.env "$VPS_USER@$VPS_HOST:${APP_DIR}/.env"

          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            cd '${APP_DIR}'
            docker network inspect main-network >/dev/null 2>&1 || docker network create main-network
            echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin
            docker compose --env-file .env -f docker-compose.staging.yml pull
            docker compose --env-file .env -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -af --filter 'until=24h' || true

            sudo mv '/tmp/${APP_NAME}-staging.conf' '/etc/nginx/conf.d/${APP_NAME}-staging.conf'
            sudo nginx -t
            sudo nginx -s reload || sudo systemctl reload nginx
          "

          rm -f .vps.env
          rm -f .site.conf
