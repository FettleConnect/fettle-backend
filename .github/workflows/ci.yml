name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - snehit

jobs:
  transcribe-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fettle_backend
          POSTGRES_USER: fettle
          POSTGRES_PASSWORD: fettle
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fettle -d fettle_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://fettle:fettle@localhost:5433/fettle_backend
      INTERNAL_API_ENABLED: "true"
      INTERNAL_API_KEY: test-internal-key
      LEGACY_AUTH_SECRET: test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type validation
        run: mypy src/fettle_backend

      - name: Contract tests
        run: python -m pytest tests/contract -q
