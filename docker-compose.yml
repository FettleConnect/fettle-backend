services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fettle_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-key-change-me-32-chars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INTERNAL_API_BASE_URL: http://api:8000
    volumes:
      - ./api/app:/app/app:rw          # hot-reload application code
      - ./api/alembic:/app/alembic:rw  # alembic migrations
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-network

  api-test:
    build:
      context: .
      dockerfile: api/Dockerfile.test
    command: pytest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fettle_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-key-change-me-32-chars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INTERNAL_API_BASE_URL: http://api:8000
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-test-internal-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-openai-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-test-openrouter-key}
    volumes:
      - ./api/app:/app/app:rw
      - ./tests:/app/tests:rw
      - ./pytest.ini:/app/pytest.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network
    profiles:
      - test

  celery:
    build:
      context: .
      dockerfile: api/Dockerfile
    # app.worker is the module containing tasks.py (NOT app.tasks)
    command: celery -A app.celery_app.celery_app worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fettle_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-key-change-me-32-chars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INTERNAL_API_BASE_URL: http://api:8000
    volumes:
      - ./api/app:/app/app:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-network

  fettle-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      LIVEKIT_URL_INTERNAL: http://livekit-server:7880
    depends_on:
      api:
        condition: service_healthy
      livekit-server:
        condition: service_started
      livekit-sip:
        condition: service_started
    restart: unless-stopped
    networks:
      - dev-network

  livekit-sip:
    image: livekit/sip:latest
    env_file:
      - .env
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit-server:7880
        redis:
          address: redis:6379
        sip_port: 5061
        rtp_port: 40000-40100
        use_external_ip: true
        logging:
          level: debug
    depends_on:
      livekit-server:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "5061:5061/tcp"
      - "5061:5061/udp"
      - "40000-40100:40000-40100/udp"
    restart: unless-stopped
    networks:
      - dev-network

  livekit-server:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --redis-host redis:6379
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_LOG_LEVEL: ${LIVEKIT_LOG_LEVEL:-info}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fettle_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fettle_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata_dev:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_dev:
  redisdata_dev:

networks:
  dev-network:
    driver: bridge
