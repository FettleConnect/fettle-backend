services:
  app:
    build:
      context: .
    container_name: fettle-backend-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://fettle:fettle@postgres:5432/fettle_backend
      INTERNAL_API_ENABLED: "true"
      INTERNAL_API_KEY: change-me
      LEGACY_AUTH_SECRET: change-me
      ARTIFACT_STORAGE_ROOT: /app/var/artifacts
      PDF_DELIVERY_PUBLIC_BASE_URL: http://localhost:8000
      FETTLE_SYNC_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/app/var/artifacts
    command: >
      sh -c "alembic upgrade head &&
      uvicorn fettle_backend.app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:17
    container_name: fettle-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fettle_backend
      POSTGRES_USER: fettle
      POSTGRES_PASSWORD: fettle
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fettle -d fettle_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artifact-data:
  postgres-data:
