services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fettle_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-key-change-me-32-chars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INTERNAL_API_BASE_URL: http://api:8000
    volumes:
      - ./api/app:/app/app:rw          # hot-reload application code
      - ./api/alembic:/app/alembic:rw  # alembic migrations
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-network

  celery:
    build:
      context: ./api
      dockerfile: Dockerfile
    # app.worker is the module containing tasks.py (NOT app.tasks)
    command: celery -A app.celery_app.celery_app worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fettle_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-key-change-me-32-chars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INTERNAL_API_BASE_URL: http://api:8000
    volumes:
      - ./api/app:/app/app:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-network

  fettle-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      LIVEKIT_URL_INTERNAL: http://livekit-server:7880
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - dev-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fettle_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fettle_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata_dev:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_dev:
  redisdata_dev:

networks:
  dev-network:
    driver: bridge
