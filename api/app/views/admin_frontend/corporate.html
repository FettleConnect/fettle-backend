<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fettle Admin Corporate</title>
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script src="/admin/assets/corporate.js" defer></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/admin">Fettle Admin</a>
    <nav>
      <a href="/admin">Dashboard</a>
      <a href="/admin/hospitals">Hospitals</a>
      <a class="active" href="/admin/corporate">Corporate</a>
      <a href="/admin/tables">Database</a>
    </nav>
  </aside>
  <main>
    <header class="page-header">
      <div>
        <p class="eyebrow">Clients</p>
        <h1>Corporate</h1>
      </div>
    </header>
    <section class="panel">
      <div class="section-heading">
        <h2>Add corporate client</h2>
      </div>
      <form id="corporate-form">
        <input name="name" placeholder="Company name" required />
        <input name="slug" placeholder="slug" required />
        <input name="subdomain" placeholder="subdomain" required />
        <input type="hidden" name="type" value="corporate" />
        <button>Create</button>
      </form>
    </section>
    <section class="panel">
      <div class="section-heading">
        <h2>Corporate Clients</h2>
      </div>
      <div class="table-scroll">
        <table id="corporates">
          <thead><tr><th>Name</th><th>Subdomain</th><th>Status</th><th>ID</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
