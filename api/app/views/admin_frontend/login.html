<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fettle Admin Login</title>
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script src="/admin/assets/login.js" defer></script>
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">Platform Admin</p>
    <h1>Sign in</h1>
    <form id="login-form" class="single-column">
      <input name="username" placeholder="Username" autocomplete="username" required />
      <input name="password" placeholder="Password" type="password" autocomplete="current-password" required />
      <button>Sign in</button>
    </form>
    <p id="login-error" class="error-text"></p>
  </section>
</main>
</body>
</html>
