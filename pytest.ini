[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: marks tests as requiring a running PostgreSQL database (deselect with -m "not integration")
    e2e: marks full end-to-end tests covering complete user flows (subset of integration)
filterwarnings =
    ignore::DeprecationWarning
